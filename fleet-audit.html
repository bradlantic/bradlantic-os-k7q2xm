filter(t=>t.v===e).length,At=eu.filter(e=>e.hire).length,Vc=gt.filter(e=>e.v==="KEEP"&&e.role==="head").length,bi=`You're going to audit every bot I have and help me turn them into a clean, organised fleet. Not 150 bots, and not five megabots that do everything. A small company where every bot has one clear job.

RULES (read these first)
- This is a proposal. Do NOT delete, pause, edit, rename or message any bot until I say yes to that specific bot.
- Read only. Use what you can see: each bot's name, description, skills, routines, memory, and its recent chat.
- Never guess. If you can't see something (like a routine's schedule), write "unknown".
- Leave out private stuff: no emails, card numbers, client names or money amounts in anything I might show on screen.

STEP 1: LIST EVERYTHING
Make one table with every bot I have:
name | what it actually does (one line) | routines (name, schedule, on or paused) | last time it did real work | where it came from (I made it for a real job, a video or demo, a template I imported, or a copy of another bot)
Tell me the total count at the top.

STEP 2: SCORE EACH BOT (1 to 5)
- Job clarity: can you say its job in one sentence, with one number that proves it's working?
- Usage: has it done real work in the last 7 days? (A broadcast like "pause your routines" doesn't count.)
- Overlap: does another bot do the same job? Name it.
- Goal fit: does it move one of my goals? Ask me for my top 3 goals before you score this.
Also flag anything running a routine that nobody reads. Those cost usage every day.

STEP 3: GIVE EACH BOT ONE VERDICT
- KEEP: one clear job, used, serves a goal.
- MERGE INTO <bot>: the job is real but another bot should own it. Say exactly what moves (skills, memory, routine) and in what order.
- BENCH: might be useful later. Pause its routines and hide it, nothing deleted.
- DELETE: made for a video or demo, never used, a duplicate, or blocked for over a week with no plan.
One line of reason each, based on evidence (dates, routines, messages), not on the name.

STEP 4: FIND THE GAPS
Look at what keeps getting stuck: things waiting on me, jobs that show up in 2 or more bots, money or deadlines nobody owns, and any one bot doing too many jobs. Suggest at most 3 new bots. For each: its one job, its one number, who it reports to, and which bottleneck it fixes. If moving a routine to an existing bot fixes it, say that instead of hiring.

STEP 5: DESIGN THE ORG
Use these rules:
- I talk to one bot (a Chief of Staff). Everything else reports up.
- Each department: one head, 2 to 5 workers, one KPI with a deadline ("5,000 newsletter subscribers by 31 Dec") every worker feeds.
- Every bot: one job, one number. If you need "and" to describe it, split it or merge it.
- Max 4 levels under me.
- Approvals only for anything that sends, posts, spends money or deploys. Everything else just gets done.
- Reporting: every bot ends each job it already runs by saving one status line: state (working, waiting on me, idle), what it finished, what it needs from me, its number today. No extra runs just to report.
- The Chief of Staff reads those lines, ranks what needs me by deadline and money, and passes my yes or no back to the right bot.
Show me before and after: how many bots now, how many active after, how many benched.

STEP 6: SHOW ME
Build me a Page with:
1. A board view with four columns: Keep, Merge, Bench, Delete, one card per bot (name, job, last active, reason).
2. The AFTER org chart: me, Chief of Staff, then each department's head, workers and dated KPI.
3. The gaps, with why.
